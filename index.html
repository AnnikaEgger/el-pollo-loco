<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />
    <title>El Pollo Loco</title>
    <link
      rel="shortcut icon"
      href="./img/6_salsa_bottle/salsa_bottle.png"
      type="image/x-icon"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Spicy+Rice&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="standard.css" />
    <link rel="stylesheet" href="style.css" />

    <script src="./models/level.class.js"></script>
    <script src="./models/keyboard.class.js"></script>

    <script src="./models/drawable-object.class.js"></script>
    <script src="./models/movable-object.class.js"></script>
    <script src="./models/throwable-object.class.js"></script>
    <script src="./models/chicken.class.js"></script>
    <script src="./models/chicken-normal.class.js"></script>
    <script src="./models/chicken-small.class.js"></script>
    <script src="./models/coin.class.js"></script>
    <script src="./models/cloud.class.js"></script>
    <script src="./models/statusbar.class.js"></script>
    <script src="./models/statusbar-health.class.js"></script>
    <script src="./models/statusbar-bottles.class.js"></script>
    <script src="./models/statusbar-coins.class.js"></script>
    <script src="./models/statusbar-endboss.class.js"></script>

    <script src="./models/background-object.class.js"></script>
    <script src="./models/endboss.class.js"></script>
    <script src="./levels/level1.js" defer></script>
    <script src="./models/world.class.js"></script>
    <script src="./models/character.class.js"></script>

    <script src="./scripts/game.js" defer></script>
  </head>

  <body onload="init()">
    <h1>El Pollo Loco</h1>

    <div id="fullscreen" class="content-wrapper">
      <canvas id="canvas" width="720px" height="480px"></canvas>

      <div id="home-screen" class="overlay-container home-container">
        <img
          class="overlay-img overlay-img--full"
          src="./img/9_intro_outro_screens/start/startscreen_1.png"
          alt=""
        />

        <button onclick="startGame()" class="start-btn">
          <img src="./icons/start-icon.png" alt="start icon" />
          <p>Start Game!</p>
        </button>

        <div class="wood-signs-container">
          <button class="wood-sign">
            <p>Story</p>
            <img src="./img/wood-sign.svg" alt="wooden sign" />
          </button>

          <button class="wood-sign">
            <p>Instructions</p>
            <img src="./img/wood-sign.svg" alt="wooden sign" />
          </button>

          <button class="wood-sign">
            <p>Settings</p>
            <img src="./img/wood-sign.svg" alt="wooden sign" />
          </button>

          <button class="wood-sign">
            <p>Legal Notice</p>
            <img src="./img/wood-sign.svg" alt="wooden sign" />
          </button>

          <button class="wood-sign">
            <p>Privacy Policy</p>
            <img src="./img/wood-sign.svg" alt="wooden sign" />
          </button>
        </div>
      </div>

      <div id="outro-screen" class="overlay-container outro-container">
        <img
          id="game-over-img"
          src="./img/9_intro_outro_screens/game_over/game over!.png"
          alt="Outro Screen"
          class="outro-screen overlay-img overlay-img--full display-none"
        />
        <img
          id="you-win-img"
          src="./img/You won, you lost/You Win B.png"
          alt="Outro Screen"
          class="outro-screen overlay-img overlay-img--win display-none"
        />
        <div class="outro-btns-container">
          <button onclick="restartGame()">
            <p>Retry</p>
            <img src="./icons/restart-icon.png" alt="restart icon" />
          </button>
          <button onclick="backToHomeScreen()">
            <p>Menu</p>
            <img src="./icons/home-icon.png" alt="home icon" />
          </button>
        </div>
      </div>

      <div class="btns-wrapper">
        <button class="mute-btn" onclick="toggleGameSound()">
          <img src="./icons/sound-icon.png" alt="Mute Icon" />
        </button>
        <button class="pause-btn" onclick="togglePauseGame()">
          <img src="./icons/pause-icon.png" alt="Pause Icon" />
        </button>
        <button onclick="toggleFullscreen()" class="fullscreen-btn">
          <img src="./icons/fullscreen-icon.png" alt="Fullscreen Icon" />
        </button>
      </div>

      <div class="pause-menu">
        <button>
          <img src="./icons/settings-icon.png" alt="settings icon" />
          <p>Settings</p>
        </button>
        <button onclick="restartGame()">
          <img src="./icons/restart-icon.png" alt="restart icon" />
          <p>Restart</p>
        </button>
        <button>
          <img src="./icons/home-icon.png" alt="home icon" />
          <p>Menu</p>
        </button>
        <button class="wood-sign">
          <p>Instructions</p>
          <img src="" alt="wooden sign" />
        </button>
      </div>
    </div>
  </body>
</html>
