<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />
    <title>El Pollo Loco</title>
    <link
      rel="shortcut icon"
      href="./img/6_salsa_bottle/salsa_bottle.png"
      type="image/x-icon"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Spicy+Rice&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="standard.css" />
    <link rel="stylesheet" href="style.css" />

    <script src="./models/level.class.js"></script>
    <script src="./models/keyboard.class.js"></script>

    <script src="./models/drawable-object.class.js"></script>
    <script src="./models/movable-object.class.js"></script>
    <script src="./models/throwable-object.class.js"></script>
    <script src="./models/chicken.class.js"></script>
    <script src="./models/chicken-normal.class.js"></script>
    <script src="./models/chicken-small.class.js"></script>
    <script src="./models/coin.class.js"></script>
    <script src="./models/cloud.class.js"></script>
    <script src="./models/statusbar.class.js"></script>
    <script src="./models/statusbar-health.class.js"></script>
    <script src="./models/statusbar-bottles.class.js"></script>
    <script src="./models/statusbar-coins.class.js"></script>
    <script src="./models/statusbar-endboss.class.js"></script>

    <script src="./models/background-object.class.js"></script>
    <script src="./models/endboss.class.js"></script>
    <script src="./levels/level1.js" defer></script>
    <script src="./models/world.class.js"></script>
    <script src="./models/character.class.js"></script>

    <script src="./scripts/templates.js"></script>
    <script src="./scripts/display-manager.js" defer></script>
    <script src="./scripts/game.js" defer></script>
  </head>
  <body onload="init()">
    <h1 class="game-title">El Pollo Loco</h1>

    <div id="fullscreen" class="content-wrapper">
      <canvas id="canvas" width="720" height="480"></canvas>

      <div id="overlay-container" class="overlay-container"></div>

      <div id="btns-wrapper" class="btns-wrapper">
        <button class="wood-btn mute-btn" onclick="toggleGameSound()">
          <img id="mute-btn-img" src="./icons/mute-icon.png" alt="Mute Icon" />
        </button>
        <button
          id="pause-btn"
          class="wood-btn pause-btn display-none"
          onclick="togglePauseGame()"
        >
          <img
            id="pause-btn-img"
            src="./icons/pause-icon.png"
            alt="Pause Icon"
          />
        </button>

        <div id="imprint-container" class="imprint-container display-flex">
          <button onclick="showInfoScreen('Legal Notice')">
            <p>Legal Notice</p>
          </button>

          <button onclick="showInfoScreen('Privacy Policy')">
            <p>Privacy Policy</p>
          </button>
        </div>
        <button onclick="toggleFullscreen()" class="wood-btn fullscreen-btn">
          <img src="./icons/fullscreen-icon.png" alt="Fullscreen Icon" />
        </button>
      </div>
    </div>
  </body>
</html>
