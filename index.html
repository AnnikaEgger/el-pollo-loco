<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="google" content="notranslate" />
    <title>El Pollo Loco</title>
    <link
      rel="shortcut icon"
      href="./assets/img/6_salsa_bottle/salsa_bottle.png"
      type="image/x-icon"
    />

    <link rel="stylesheet" href="style/buttons.css" />
    <link rel="stylesheet" href="style/overlay.css" />
    <link rel="stylesheet" href="style/standard.css" />
    <link rel="stylesheet" href="style.css" />

    <script src="./models/level.class.js"></script>
    <script src="./models/keyboard.class.js"></script>

    <script src="./models/drawable-object.class.js"></script>
    <script src="./models/movable-object.class.js"></script>
    <script src="./models/throwable-object.class.js"></script>
    <script src="./models/chicken.class.js"></script>
    <script src="./models/chicken-normal.class.js"></script>
    <script src="./models/chicken-small.class.js"></script>
    <script src="./models/coin.class.js"></script>
    <script src="./models/cloud.class.js"></script>
    <script src="./models/statusbar.class.js"></script>
    <script src="./models/statusbar-health.class.js"></script>
    <script src="./models/statusbar-bottles.class.js"></script>
    <script src="./models/statusbar-coins.class.js"></script>
    <script src="./models/statusbar-endboss.class.js"></script>
    <script src="./models/background-object.class.js"></script>
    <script src="./models/endboss-movement.class.js"></script>
    <script src="./models/endboss.class.js"></script>

    <script src="./levels/level1.js" defer></script>
    <script src="./models/world-draw.class.js"></script>
    <script src="./models/world.class.js"></script>
    <script src="./models/character.class.js"></script>

    <script src="./scripts/templates.js"></script>
    <script src="./scripts/imprint-templates.js"></script>
    <script src="./scripts/audio.js"></script>
    <script src="./scripts/display-manager.js" defer></script>
    <script src="./scripts/game.js" defer></script>
  </head>
  <body onload="init()">
    <h1 class="game-title">El Pollo Loco</h1>

    <div id="fullscreen" class="fullscreen-wrapper">
      <div class="content-wrapper">
        <canvas id="canvas" width="720" height="480"></canvas>

        <div class="overlay-wrapper">
          <div id="overlay-container" class="overlay-container"></div>

          <div id="panel" class="panel"></div>

          <div class="control-panel">
            <div class="panel-wrapper">
              <button id="move-left-btn" class="wood-btn">
                <img src="./assets/icons/arrow-left.png" alt="arrow left" />
              </button>
              <button id="move-right-btn" class="wood-btn">
                <img src="./assets/icons/arrow-right.png" alt="arrow right" />
              </button>
            </div>
            <div class="panel-wrapper">
              <button id="jump-btn" class="wood-btn">
                <img src="./assets/icons/arrow-up.png" alt="arrow up" />
              </button>
              <button id="throw-btn" class="wood-btn">
                <img src="./assets/icons/bottle.png" alt="bottle" />
              </button>
            </div>
          </div>

          <div id="loading-spinner" class="loading-spinner display-none">
            <img
              id="loading-spinner-img"
              src="./assets/img/6_salsa_bottle/salsa_bottle.png"
              alt=""
            />
          </div>
        </div>
      </div>
    </div>

    <div class="landscape-warning">
      <img src="./assets/icons/screen-rotate.png" alt="rotate screen icon" />
      <p>Rotate your device to play!</p>
    </div>
  </body>
</html>
